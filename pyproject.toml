[project]
name = "compile-audio"
version = "0.1.0"
description = "Extractors for Compile's Windows-era audio containers (MLK songs, WLK sound effects)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "flvrdoyster" }]
keywords = ["compile", "genso", "midi", "retro", "preservation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Archiving",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
compile-audio = "compileaudio.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
